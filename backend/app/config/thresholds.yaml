# 気圧ストレス指数と体力予算のしきい値（docs/design.md §4.1 / §4.2 / §4.2.1）
#
# ここは体感との擦り合わせでチューニングする対象。式の構造は変えず、係数だけを動かす。
# F-15（気圧耐性の個人化）では、このファイルの値を個人ごとに上書きする想定。

# --- 気圧ストレス指数（0〜100）-------------------------------------------------
# 絶対値ではなく「変化率」を主軸にする。絶対値で判定すると標高の高い地域が常時
# 低気圧扱いになり、台風一過の晴天日にも誤判定するため。
pressure_stress:
  # 直近6時間の低下。「6時間で3hPa以上」が気象病の目安として言及される
  delta_6h:     {coef: 10, cap: 40}
  # 直近24時間の低下。「24時間で10hPa以上」が目安
  delta_24h:    {coef: 3,  cap: 30}
  # これから6時間の予報低下。体調は気圧に先行して崩れるため、実測の半分の重みで加味する
  delta_next6h: {coef: 5,  cap: 20}
  # 絶対値は補助指標に留める。1000hPa未満で最大10点
  absolute:     {base: 1000, cap: 10}

# --- 体力予算（0〜100）--------------------------------------------------------
# 各因子に上限（cap）を設け、単一因子が予算を食い尽くさないようにする。
energy_budget:
  weather_weight: 0.40                # 気象ストレスの重み（最大 -40）
  temp:  {coef: 2, cap: 10}           # 気温の前日比 1℃あたり2点
  humid: {base: 75, cap: 10}          # 不快指数の75超過分
  sleep: {ideal: 7, coef: 5, cap: 20} # フェーズ2（F-04）で使用
  busy:  {coef: 2, cap: 15}           # フェーズ3（F-05）で使用
  mail:  {coef: 1, cap: 5}            # フェーズ3（F-06/F-18）で使用

# --- 省エネレベルの境界（体力予算の下限）--------------------------------------
levels:
  - {level: 1, min_budget: 80}
  - {level: 2, min_budget: 60}
  - {level: 3, min_budget: 40}
  - {level: 4, min_budget: 20}
  - {level: 5, min_budget: 0}

# --- 気圧ストレスによるレベルの下限（§4.2.1 の解決）----------------------------
# 決定（2026-08-01）: 予算から求めたレベルと、ここで決まる下限の「大きい方」を採用する。
#
# 経緯: フェーズ1では気象因子しか無く、引ける点は気象40＋気温10＋湿度10＝最大60。
#       予算の下限が40になるため、予算だけではレベル4・5に原理的に到達できない。
#       台風でも爆弾低気圧でも「省エネ（Lv3）」止まりになり、「今日は気圧のせい」を
#       掲げるプロダクトとして成立しない。
#
# 設計書が挙げた案(c)（ストレス90以上でLv5固定）を一般化したもの。案(a)（重みを0.60へ）は
# フェーズ2以降で睡眠・拘束の影響が相対的に無意味になるため採らない。
stress_level_floor:
  - {min_stress: 90, level: 5}
  - {min_stress: 75, level: 4}
  - {min_stress: 55, level: 3}
  - {min_stress: 35, level: 2}

# --- 利用回数の上限（依存防止 / F-16、docs/design.md §4.8）----------------------
# 1日を6時間ごとの4フェーズに分け、フェーズごとに対話機能を使える回数を決める。
# 気圧の係数とは性質が違う値だが、専用ファイルを立てるほどの分量が無いため同居させている。
#
# 制限するのは対話機能（Geminiを呼ぶ2本）だけ。省エネ度の閲覧は常時できなければ
# ならないので、/atmosphere・/daily-plan・/context には上限を設けない（§4.8）。
usage_limit:
  # 献立・ご褒美・トーン変換
  generate:   {per_phase: 10}
  # 夜の吐き出し。上限に達しても429では拒否せず、Geminiを呼ばずに定型文を返す。
  # 拒否すると「吐き出したのに無視された」体験になるため（routers/reflection.py 参照）
  reflection: {per_phase: 3}
