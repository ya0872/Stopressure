# 省エネレベルの呼称と表示文言（docs/design.md §4.3）
#
# 数値のしきい値は app/config/thresholds.yaml 側にある。ここは文言だけを持つ。
# 分けているのは、しきい値は体感に合わせて頻繁に動かすのに対し、
# 文言はプロダクトの語り口そのもので、迂闊に変えられないため。
#
# 文言の制約（§1.2 / §1.3）:
#   - 行動を要求しない。「〜しましょう」「〜してください」で終わる指示を書かない
#     （レベル4の「休んでください」は、負荷を下げる方向の唯一の例外）
#   - 不調の原因をユーザー本人に帰属させない。主語は常に気圧側に置く

- level: 1
  name: 平常運転
  headline: 今日は気圧が穏やかです。動いても、動かなくても、どちらでも正解です。
  suggest_title: やってもやらなくてもいいこと

- level: 2
  name: 軽め
  headline: 少しだけ気圧が動いています。座ったままできることだけで十分です。
  suggest_title: 座ったままできること

- level: 3
  name: 省エネ
  headline: 気圧が下がっています。生きているだけで、今日は仕事をしています。
  suggest_title: 本日の目標

- level: 4
  name: 深い省エネ
  headline: 今日は気圧のせいです。休んでください。
  suggest_title: 本日の目標

- level: 5
  name: 完全休止
  headline: 気圧が急降下しています。今日は何もしないことが目標です。
  suggest_title: 本日の目標
