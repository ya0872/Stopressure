  suggest_title: やってもやらなくてもいいこと

- level: 4
  name: 安静に
  headline: 今日、もし動けなくてもそれは気圧のせいです。休んでください。
  suggest_title: やれたら自信になること

- level: 5
  name: 完全休止
  headline: 気圧が急降下しています。今日は何もしないことが目標です。
  suggest_title: やれたら自信になること
