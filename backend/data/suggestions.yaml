# 省エネ提案のプール（docs/design.md §4.3 / F-03）

- id: outing
  text: 行きたかった場所に出かける
  load: 1
  reason: 気圧も気温も落ち着いています。出かけるなら今日のような日です

- id: reading
  text: 本を読んでみる
  load: 1
  reason: 過ごしやすい日です。落ち着いた時間を楽しむのもいいですよ

- id: outside
  text: 少し外に出てみる
  load: 2
  reason: 気圧が安定している日は、体が動きを受け入れやすい状態です

- id: tidy
  text: 机の上だけ片付ける
  load: 2
  reason: 目に見える範囲が整うと、それだけで思考の負荷が下がります

- id: music
  text: 好きな曲を1曲だけ聴く
  load: 3
  reason: 座ったままできて、終わりがはっきりしている活動です

- id: air
  text: 窓を開けて空気を入れ替える
  load: 3
  reason: 室内の二酸化炭素が下がると、頭の重さが少し軽くなります

- id: sayu
  text: 白湯を飲む
  load: 3
  reason: 内臓を温めると自律神経が落ち着きやすいとされます

- id: breath
  text: 目を閉じて3回だけ深呼吸する
  load: 4
  reason: 3回で終わりです。それ以上は求めません

- id: stare
  text: 15分ボーッとする
  load: 4
  reason: 何も考えない時間は、脳の回復に使われています

- id: liedown
  text: 横になる
  load: 4
  reason: 体を支える筋肉を休ませるだけで消耗が止まります

- id: nothing
  text: 何もしない
  load: 5
  reason: 今日はそれが最適解です
