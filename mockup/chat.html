<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — 簡易チャット</title>
<style>
:root {
  --bg: #15171c;
  --bg-raised: #1c1f26;
  --bg-sunken: #101216;
  --border: #282c35;
  --text: #e4e1da;
  --text-dim: #8d8f98;
  --accent: hsl(215, 30%, 58%);
  --ok: hsl(150, 26%, 62%);
  --warn: hsl(38, 40%, 66%);
  --ng: hsl(5, 38%, 68%);
  --ease: cubic-bezier(0.32, 0.08, 0.24, 1);
  --dur: 400ms;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #edeae3;
    --bg-raised: #f4f2ec;
    --bg-sunken: #e3e0d8;
    --border: #d5d1c7;
    --text: #2e2d2a;
    --text-dim: #6f6d67;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  line-height: 1.8;
  letter-spacing: 0.02em;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.25rem;
}
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}
.header h1 {
  font-size: 1rem;
  letter-spacing: 0.16em;
  color: var(--text-dim);
  margin-bottom: 0.5rem;
}
.header p {
  font-size: 0.9rem;
  color: var(--text-faint);
  max-width: 60ch;
}
.nav {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.nav a {
  display: inline-block;
  text-decoration: none;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.55rem 0.9rem;
  font-size: 0.8rem;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav a:hover { background: var(--bg-raised); color: var(--text); }
.card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem;
}
.chat-window {
  display: grid;
  gap: 1rem;
}
.messages {
  min-height: 320px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 0.5rem;
  display: grid;
  gap: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-sunken);
}
.message {
  padding: 0.9rem 1rem;
  border-radius: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
}
.message.user {
  background: rgba(49, 90, 255, 0.15);
  border: 1px solid rgba(49, 90, 255, 0.25);
  align-self: end;
}
.message.assistant {
  background: rgba(123, 154, 255, 0.09);
  border: 1px solid rgba(123, 154, 255, 0.18);
}
.message span {
  display: block;
}
.message .author {
  color: var(--text-dim);
  font-size: 0.75rem;
  margin-bottom: 0.35rem;
}
.input-area {
  display: grid;
  gap: 0.75rem;
}
textarea {
  width: 100%;
  min-height: 120px;
  resize: vertical;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-sunken);
  color: var(--text);
  padding: 1rem;
  font: inherit;
}
.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
button {
  border: none;
  border-radius: 999px;
  padding: 0.85rem 1.2rem;
  cursor: pointer;
  font: inherit;
  color: var(--text);
  background: var(--accent);
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
button:hover { transform: translateY(-1px); }
button:disabled { opacity: 0.6; cursor: default; }
.note {
  color: var(--text-dim);
  font-size: 0.88rem;
}
.status {
  padding: 0.9rem 1rem;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-dim);
}
.status strong { color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>TEST</h1>
      <p>HTML とバックエンドをつなぐ簡易チャット。入力を送信すると、バックエンドの /api/v1/reflection に接続して応答を受け取ります。</p>
    </div>
  </div>

  <div class="nav">
    <a href="index.html">Home</a>
    <a href="settings.html">Settings</a>
    <a href="live.html">Live</a>
  </div>

  <div class="card chat-window">
    <div class="messages" id="messages">
      <div class="status" id="status">バックエンド接続を確認しています...</div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="ここにメッセージを入力してください。例：今日は調子が悪くて、何もできませんでした。"></textarea>
      <div class="buttons">
        <button id="send">送信</button>
        <button id="clear" type="button">クリア</button>
      </div>
      <div class="note">Gemini APIキーが未設定の場合、バックエンドは定型文で応答します。バックエンド未起動時は接続エラーが表示されます。</div>
    </div>
  </div>
</div>

<script>
function getApiBase() {
  const host = location.hostname || "localhost";
  if (location.port === "8000") {
    return `http://${host}:8001/api/v1`;
  }
  return `http://${host}:8000/api/v1`;
}
const API_BASE = window.__API_BASE__ || getApiBase();
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const statusEl = document.getElementById("status");

function addMessage(role, text) {
  const msg = document.createElement("div");
  msg.className = `message ${role}`;
  msg.innerHTML = `<span class="author">${role === "user" ? "あなた" : "応答"}</span>`
    + `<span>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setStatus(text, type = "info") {
  statusEl.textContent = text;
  statusEl.style.color = type === "error" ? "var(--ng)" : "var(--text-dim)";
}

async function api(path, method = "GET", body = null) {
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    return { ok: res.ok, status: res.status, data: text ? JSON.parse(text) : null };
  } catch (error) {
    return null;
  }
}

async function checkBackend() {
  const r = await api("/settings/gemini");
  if (!r) {
    setStatus("バックエンドが起動していません。backend を起動してください。", "error");
    return false;
  }
  setStatus(`バックエンド接続 OK。Gemini API: ${r.data?.configured ? "設定済み" : "未設定"}`);
  return true;
}

sendBtn.addEventListener("click", async () => {
  const text = inputEl.value.trim();
  if (!text) return;
  if (!(await checkBackend())) return;

  addMessage("user", text);
  inputEl.value = "";
  sendBtn.disabled = true;
  setStatus("送信中…");

  const res = await api("/reflection", "POST", { text });
  if (!res) {
    setStatus("バックエンドに接続できません。", "error");
    addMessage("assistant", "バックエンドに接続できません。backend を起動してから再度お試しください。");
    sendBtn.disabled = false;
    return;
  }

  if (res.ok) {
    const reply = res.data.reply;
    addMessage("assistant", reply);
    setStatus(res.data.fallback ? "定型文で応答しました。Gemini APIキーを設定すると本番応答になります。" : `応答を受信しました（${res.data.model}）`);
  } else if (res.status === 409) {
    addMessage("assistant", "Gemini APIキーが未設定のため、定型文を返しました。設定画面からキーを登録してください。");
    setStatus("Gemini APIキーが未設定です。設定画面から登録してください。", "warn");
  } else {
    const detail = res.data?.detail || "不明なエラーです。";
    addMessage("assistant", `エラー: ${detail}`);
    setStatus("応答に失敗しました。", "error");
  }

  sendBtn.disabled = false;
});

clearBtn.addEventListener("click", () => {
  messagesEl.innerHTML = "";
  messagesEl.appendChild(statusEl);
  inputEl.value = "";
  setStatus("メッセージをクリアしました。" );
});

inputEl.addEventListener("keydown", event => {
  if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    sendBtn.click();
  }
});

checkBackend();
</script>
</body>
</html>
